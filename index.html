<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work & Overtime Tracker</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --primary: #2c3e50;
            --work-color: #27ae60;
            --off-color: #e74c3c;
            --ot-color: #f39c12;
            --delete-color: #c0392b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 { text-align: center; color: var(--primary); margin-top: 0; }

        /* Stats Section */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .stat-card h4 { margin: 0; font-size: 11px; color: #666; text-transform: uppercase; }
        .stat-card p { margin: 5px 0 0; font-size: 18px; font-weight: bold; }

        /* Input Form */
        .form-group {
            margin-bottom: 15px;
        }

        label { display: block; margin-bottom: 5px; font-weight: bold; }

        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:hover { opacity: 0.9; }

        /* Log List */
        .log-title { margin-top: 25px; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        
        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            background: #f9f9f9;
            border: 1px solid #eee;
        }

        .log-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tag {
            padding: 3px 6px;
            border-radius: 4px;
            color: white;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
        }
        .tag-work { background-color: var(--work-color); }
        .tag-off { background-color: var(--off-color); }
        .tag-ot { background-color: var(--ot-color); }

        .btn-delete {
            background-color: transparent;
            color: var(--delete-color);
            border: 1px solid var(--delete-color);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            width: auto;
        }

        .btn-delete:hover {
            background-color: var(--delete-color);
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Work & Overtime Tracker</h2>

    <!-- Summary Section -->
    <div class="stats-grid">
        <div class="stat-card">
            <h4>WORK DAYS</h4>
            <p id="totalWork">0</p>
        </div>
        <div class="stat-card">
            <h4>OFF DAYS</h4>
            <p id="totalOff">0</p>
        </div>
        <div class="stat-card">
            <h4>OVERTIME</h4>
            <p id="totalOT">0 hrs</p>
        </div>
    </div>

    <!-- Data Entry Form -->
    <form id="trackerForm">
        <div class="form-group">
            <label for="date">Select Date:</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label for="status">Day Status:</label>
            <select id="status">
                <option value="Work">Work Day</option>
                <option value="Off">Off Day</option>
            </select>
        </div>

        <div class="form-group">
            <label for="overtime">Overtime (Hours):</label>
            <input type="number" id="overtime" min="0" max="24" step="0.5" value="0">
        </div>

        <button type="submit" class="btn-submit">Save Entry</button>
    </form>

    <!-- Recent Logs -->
    <h3 class="log-title">Recent Records</h3>
    <div id="logsContainer"></div>
</div>

<script>
    // Load data from localStorage or create an empty object
    let appData = JSON.parse(localStorage.getItem('factoryWorkLogs')) || {};

    // Set today's date as default in input
    document.getElementById('date').valueAsDate = new Date();

    const form = document.getElementById('trackerForm');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const date = document.getElementById('date').value;
        const status = document.getElementById('status').value;
        const overtime = parseFloat(document.getElementById('overtime').value) || 0;

        // Save or update record for the date
        appData[date] = { status, overtime };

        // Save to LocalStorage
        localStorage.setItem('factoryWorkLogs', JSON.stringify(appData));

        // Refresh UI
        updateUI();
    });

    // Function to delete a record
    function deleteRecord(date) {
        if (confirm(`Are you sure you want to delete the entry for ${date}?`)) {
            delete appData[date];
            localStorage.setItem('factoryWorkLogs', JSON.stringify(appData));
            updateUI();
        }
    }

    function updateUI() {
        const logsContainer = document.getElementById('logsContainer');
        logsContainer.innerHTML = '';

        let totalWork = 0;
        let totalOff = 0;
        let totalOT = 0;

        // Sort dates in descending order (latest first)
        const sortedDates = Object.keys(appData).sort().reverse();

        if (sortedDates.length === 0) {
            logsContainer.innerHTML = '<p style="text-align:center; color:#888;">No records saved yet.</p>';
        }

        sortedDates.forEach(date => {
            const entry = appData[date];

            if (entry.status === 'Work') totalWork++;
            if (entry.status === 'Off') totalOff++;
            totalOT += entry.overtime;

            // Create Log Row
            const div = document.createElement('div');
            div.className = 'log-item';
            
            let statusTag = entry.status === 'Work' 
                ? `<span class="tag tag-work">Work</span>` 
                : `<span class="tag tag-off">Off</span>`;

            let otTag = entry.overtime > 0 
                ? `<span class="tag tag-ot">+${entry.overtime} hrs OT</span>` 
                : '';

            div.innerHTML = `
                <div class="log-details">
                    <strong>${date}</strong>
                    <div>${statusTag} ${otTag}</div>
                </div>
                <div class="log-actions">
                    <button class="btn-delete" onclick="deleteRecord('${date}')">Delete</button>
                </div>
            `;

            logsContainer.appendChild(div);
        });

        // Update Stats Header
        document.getElementById('totalWork').innerText = totalWork;
        document.getElementById('totalOff').innerText = totalOff;
        document.getElementById('totalOT').innerText = `${totalOT} hrs`;
    }

    // Initial Render
    updateUI();
</script>

</body>
</html>
